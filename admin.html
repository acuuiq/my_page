<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لوحة الإدارة | LEON_AT</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      .admin-container {
        max-width: 800px;
        margin: 50px auto;
        padding: 30px;
        background: var(--dark-2);
        border-radius: 16px;
        border: 1px solid rgba(41, 214, 255, 0.2);
      }
      .admin-container h1 {
        color: var(--primary);
        margin-bottom: 30px;
        text-align: center;
      }
      .admin-form label {
        display: block;
        margin-bottom: 8px;
        color: var(--light);
        font-weight: 600;
      }
      .admin-form input,
      .admin-form textarea,
      .admin-form select {
        width: 100%;
        padding: 12px;
        margin-bottom: 20px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: var(--dark);
        color: var(--light);
        font-family: "Cairo", sans-serif;
        font-size: 15px;
      }
      .admin-form input:focus,
      .admin-form textarea:focus,
      .admin-form select:focus {
        outline: none;
        border-color: var(--primary);
      }
      .admin-form textarea {
        min-height: 100px;
        resize: vertical;
      }
      .admin-form button {
        width: 100%;
        padding: 14px;
        background: var(--primary);
        color: var(--dark);
        border: none;
        border-radius: 10px;
        font-family: "Cairo", sans-serif;
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.3s;
      }
      .admin-form button:hover {
        background: #00b8e0;
        transform: translateY(-2px);
      }
      .message {
        padding: 15px;
        margin-top: 20px;
        border-radius: 8px;
        text-align: center;
        font-weight: 700;
      }
      .message.success {
        background: rgba(0, 212, 100, 0.15);
        color: #00d464;
        border: 1px solid rgba(0, 212, 100, 0.3);
      }
      .message.error {
        background: rgba(255, 50, 50, 0.15);
        color: #ff3333;
        border: 1px solid rgba(255, 50, 50, 0.3);
      }
      .mods-list {
        margin-top: 40px;
      }
      .mods-list h2 {
        color: var(--primary);
        margin-bottom: 20px;
      }
      .mod-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px;
        background: var(--dark);
        border-radius: 10px;
        margin-bottom: 10px;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .mod-item h3 {
        font-size: 16px;
        color: var(--light);
      }
      .mod-item button {
        background: #ff3333;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 6px;
        font-family: "Cairo", sans-serif;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s;
      }
      .mod-item button:hover {
        background: #cc0000;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-container">
        <a href="index.html" class="logo">
          <img src="images/logo.png" alt="LEON_AT" class="logo-img" />
          <span>LEON_AT</span>
        </a>
        <ul class="nav-links">
          <li><a href="index.html">الرئيسية</a></li>
          <li><a href="addons-java.html">إضافات Java</a></li>
          <li><a href="admin.html">لوحة الإدارة</a></li>
        </ul>
      </div>
    </nav>

    <div class="admin-container">
      <h1>🎛️ لوحة إدارة المودات</h1>

      <form class="admin-form" id="modForm">
        <label>اسم المود *</label>
        <input
          type="text"
          id="title"
          required
          placeholder="مثال: متجر متكامل"
        />

        <label>الوصف *</label>
        <textarea
          id="description"
          required
          placeholder="وصف مختصر للمود..."
        ></textarea>

        <label>رابط الصورة</label>
        <input
          type="text"
          id="image_url"
          placeholder="images/mod1.jpg أو رابط كامل"
        />

        <label>رابط التحميل *</label>
        <input
          type="text"
          id="download_url"
          required
          placeholder="https://www.mediafire.com/file/..."
        />

        <label>التصنيف</label>
        <select id="category">
          <option value="mods">مودات</option>
          <option value="packs">ريسورس باكات</option>
          <option value="shaders">شيدرز</option>
          <option value="worlds">عوالم</option>
        </select>

        <button type="submit">➕ إضافة المود</button>
      </form>

      <div id="message"></div>

      <div class="mods-list">
        <h2>📋 المودات المضافة</h2>
        <div id="modsList">جارٍ التحميل...</div>
      </div>
    </div>

    <script>
      const API_URL = "https://leon-at.leon-at.workers.dev/api/mods";

      // ===== إضافة مود =====
      document
        .getElementById("modForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const mod = {
            title: document.getElementById("title").value,
            description: document.getElementById("description").value,
            image_url: document.getElementById("image_url").value,
            download_url: document.getElementById("download_url").value,
            category: document.getElementById("category").value,
          };

          try {
            const response = await fetch(API_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(mod),
            });

            const data = await response.json();

            if (data.success) {
              showMessage("✅ تم إضافة المود بنجاح!", "success");
              document.getElementById("modForm").reset();
              loadMods();
            } else {
              showMessage("❌ خطأ: " + data.error, "error");
            }
          } catch (error) {
            showMessage("❌ خطأ في الاتصال: " + error.message, "error");
          }
        });

      // ===== عرض المودات =====
      async function loadMods() {
        try {
          const response = await fetch(API_URL);
          const mods = await response.json();

          const list = document.getElementById("modsList");

          if (mods.length === 0) {
            list.innerHTML = "<p style='color:#888'>لا توجد مودات بعد.</p>";
            return;
          }

          list.innerHTML = mods
            .map(
              (mod) => `
          <div class="mod-item">
            <h3>${mod.title}</h3>
            <button onclick="deleteMod(${mod.id})">حذف</button>
          </div>
        `,
            )
            .join("");
        } catch (error) {
          document.getElementById("modsList").innerHTML =
            "<p style='color:#ff3333'>خطأ في تحميل المودات</p>";
        }
      }

      // ===== حذف مود =====
      async function deleteMod(id) {
        if (!confirm("هل أنت متأكد من الحذف؟")) return;

        try {
          await fetch(API_URL + "/" + id, { method: "DELETE" });
          showMessage("✅ تم الحذف", "success");
          loadMods();
        } catch (error) {
          showMessage("❌ خطأ في الحذف", "error");
        }
      }

      // ===== رسالة =====
      function showMessage(text, type) {
        const msg = document.getElementById("message");
        msg.className = "message " + type;
        msg.textContent = text;
        setTimeout(() => {
          msg.textContent = "";
          msg.className = "";
        }, 4000);
      }

      // تحميل المودات عند الفتح
      loadMods();
    </script>
  </body>
</html>
