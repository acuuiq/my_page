<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لوحة التحكم الكبرى | LEON_AT</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      .admin-container {
        max-width: 1400px;
        margin: 40px auto;
        padding: 30px;
      }
      .admin-header {
        text-align: center;
        margin-bottom: 40px;
      }
      .admin-header h1 {
        font-size: 32px;
        color: var(--primary);
        margin-bottom: 10px;
      }

      /* التبويبات الرئيسية */
      .main-tabs {
        display: flex;
        gap: 6px;
        background: var(--dark-2);
        padding: 6px;
        border-radius: 14px;
        margin-bottom: 20px;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      .main-tab {
        flex: 1;
        padding: 12px 20px;
        background: transparent;
        border: none;
        color: #888;
        font-family: "Cairo", sans-serif;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
        border-radius: 10px;
        transition: all 0.3s;
      }
      .main-tab.active {
        background: var(--gradient-1);
        color: white;
        box-shadow: 0 6px 20px rgba(41, 214, 255, 0.3);
      }

      /* قائمة الأقسام الثمانية */
      .category-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 30px;
      }
      .cat-btn {
        padding: 8px 16px;
        background: var(--dark);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #bbb;
        border-radius: 8px;
        font-family: "Cairo";
        cursor: pointer;
        transition: 0.3s;
      }
      .cat-btn.active {
        background: rgba(41, 214, 255, 0.15);
        border-color: var(--primary);
        color: var(--primary);
        font-weight: bold;
      }
      .cat-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .panel-card {
        background: var(--dark-2);
        padding: 25px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        margin-bottom: 20px;
      }
      .panel-card h2 {
        font-size: 20px;
        color: var(--primary);
        margin-bottom: 20px;
        border-bottom: 1px solid rgba(41, 214, 255, 0.15);
        padding-bottom: 12px;
      }
      .form-group {
        margin-bottom: 18px;
      }
      .form-group label {
        display: block;
        margin-bottom: 8px;
        color: var(--light);
        font-weight: 600;
        font-size: 14px;
      }
      .form-group input,
      .form-group textarea,
      .form-group select {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: var(--dark);
        color: var(--light);
        font-family: "Cairo";
        font-size: 14px;
      }
      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
      }

      .btn {
        padding: 12px 24px;
        border-radius: 10px;
        font-family: "Cairo";
        font-weight: 700;
        cursor: pointer;
        border: none;
        transition: 0.3s;
      }
      .btn-primary {
        background: var(--gradient-1);
        color: white;
        width: 100%;
        padding: 14px;
        font-size: 16px;
      }
      .btn-danger {
        background: rgba(255, 50, 50, 0.15);
        color: #ff5555;
        border: 1px solid rgba(255, 50, 50, 0.3);
        padding: 6px 14px;
        font-size: 12px;
      }
      .btn-secondary {
        background: rgba(255, 255, 255, 0.08);
        color: var(--light);
      }

      .message {
        padding: 14px;
        margin: 20px 0;
        border-radius: 10px;
        text-align: center;
        font-weight: 700;
        display: none;
      }
      .message.success {
        display: block;
        background: rgba(0, 212, 100, 0.15);
        color: #00d464;
      }
      .message.error {
        display: block;
        background: rgba(255, 50, 50, 0.15);
        color: #ff5555;
      }

      .items-list {
        display: grid;
        gap: 12px;
        margin-top: 15px;
      }
      .item-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px;
        background: var(--dark);
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      .item-row-info {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .item-row-info img {
        width: 50px;
        height: 50px;
        border-radius: 8px;
        object-fit: cover;
      }
      .item-row h3 {
        font-size: 15px;
        margin-bottom: 3px;
      }
      .item-row p {
        font-size: 12px;
        color: #888;
      }

      .version-row {
        display: grid;
        grid-template-columns: 1fr 1fr 2fr 2fr auto;
        gap: 10px;
        margin-bottom: 10px;
      }
      @media (max-width: 768px) {
        .form-row,
        .version-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body id="top">
    <nav class="navbar">
      <div class="nav-container">
        <a href="index.html" class="logo">
          <img src="images/logo.png" alt="LEON_AT" class="logo-img" />
          <span>LEON_AT</span>
        </a>
        <ul class="nav-links">
          <li>
            <a
              href="javascript:void(0)"
              onclick="window.location.href = base + 'index.html'"
              >الرئيسية</a
            >
          </li>
          <li><a href="admin.html">لوحة التحكم</a></li>
        </ul>
      </div>
    </nav>

    <div class="admin-container">
      <div class="admin-header">
        <h1>🎛️ لوحة التحكم الكبرى</h1>
        <p>إدارة شاملة لجميع أقسام الموقع</p>
      </div>

      <!-- التبويب الرئيسي -->
      <div class="main-tabs">
        <button class="main-tab active" data-tab="add">➕ إضافة محتوى</button>
        <button class="main-tab" data-tab="manage">📋 إدارة المحتوى</button>
      </div>

      <!-- تبويب الإضافة -->
      <div id="panel-add" class="admin-panel">
        <div class="panel-card">
          <h2>اختر القسم المراد الإضافة إليه:</h2>
          <div class="category-tabs">
            <button class="cat-btn active" data-cat="mods_java">
              ☕ مودات جافا
            </button>
            <button class="cat-btn" data-cat="mods_bedrock">
              📱 مودات بيدروك
            </button>
            <button
              class="cat-btn"
              disabled
              style="text-decoration: line-through"
            >
              🔫 مودات راست (قريباً)
            </button>
            <button
              class="cat-btn"
              disabled
              style="text-decoration: line-through"
            >
              🦖 مودات آرك (قريباً)
            </button>
            <button class="cat-btn" data-cat="games">🎮 ألعاب</button>
            <button class="cat-btn" data-cat="apps">💻 تطبيقات</button>
            <button class="cat-btn" data-cat="launchers">⛏️ مشغّلات</button>
            <button class="cat-btn" data-cat="websites">🌐 مواقع</button>
          </div>

          <form id="addForm">
            <div class="form-row">
              <div class="form-group">
                <label>الاسم / العنوان *</label>
                <input
                  type="text"
                  id="title"
                  required
                  placeholder="اسم المود، اللعبة، التطبيق..."
                />
              </div>
              <div class="form-group" id="editionGroup" style="display: none">
                <label>إصدار اللعبة (للجافا فقط) *</label>
                <select id="edition">
                  <option value="java">Java Edition</option>
                  <option value="bedrock">Bedrock Edition</option>
                </select>
              </div>
            </div>

            <div class="form-row" id="versionGroup" style="display: none">
              <div class="form-group">
                <label>نواة المود (Loader) *</label>
                <select id="loader">
                  <option value="Fabric">Fabric (فابريك)</option>
                  <option value="Forge">Forge (فورج)</option>
                  <option value="NeoForge">NeoForge</option>
                  <option value="Quilt">Quilt</option>
                  <option value="None">بدون نواة</option>
                </select>
              </div>
              <div class="form-group">
                <label>إصدار اللعبة (مثلاً 1.20.1) *</label>
                <input type="text" id="game_version" placeholder="1.20.1" />
              </div>
            </div>

            <div class="form-group">
              <label>الوصف المختصر *</label>
              <textarea
                id="description"
                required
                style="min-height: 80px"
              ></textarea>
            </div>
            <div class="form-group" id="fullDescGroup">
              <label>الوصف الكامل</label>
              <textarea
                id="full_description"
                style="min-height: 120px"
              ></textarea>
            </div>

            <div class="form-group">
              <label>رابط الصورة الرئيسية *</label>
              <input
                type="text"
                id="image_url"
                required
                placeholder="images/xxx.jpg"
              />
            </div>

            <div class="form-group">
              <label>رابط التحميل / الموقع</label>
              <input type="text" id="download_url" placeholder="https://..." />
            </div>

            <div class="form-group">
              <label>رابط فيديو الشرح (اختياري)</label>
              <input
                type="text"
                id="video_url"
                placeholder="https://youtube.com/..."
              />
            </div>

            <button type="submit" class="btn btn-primary">💾 حفظ ونشر</button>
          </form>
          <div id="message" class="message"></div>
        </div>
      </div>

      <!-- تبويب الإدارة -->
      <div id="panel-manage" class="admin-panel" style="display: none">
        <div class="panel-card">
          <h2>اختر القسم لعرض محتواه:</h2>
          <div class="category-tabs">
            <button class="cat-btn active" data-mcat="mods_java">
              ☕ مودات جافا
            </button>
            <button class="cat-btn" data-mcat="mods_bedrock">
              📱 مودات بيدروك
            </button>
            <button class="cat-btn" data-mcat="games">🎮 ألعاب</button>
            <button class="cat-btn" data-mcat="apps">💻 تطبيقات</button>
            <button class="cat-btn" data-mcat="launchers">⛏️ مشغّلات</button>
            <button class="cat-btn" data-mcat="websites">🌐 مواقع</button>
          </div>

          <div id="itemsList" class="items-list"></div>
        </div>
      </div>
    </div>

    <script>
      const API_URL = "https://leon-at.leon-at.workers.dev/api/mods";
      let currentCategory = "mods_java";

      // التبديل بين تبويب الإضافة والإدارة
      document.querySelectorAll(".main-tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          document
            .querySelectorAll(".main-tab")
            .forEach((t) => t.classList.remove("active"));
          tab.classList.add("active");
          document
            .querySelectorAll(".admin-panel")
            .forEach((p) => (p.style.display = "none"));
          document.getElementById(`panel-${tab.dataset.tab}`).style.display =
            "block";
          if (tab.dataset.tab === "manage") loadItems();
        });
      });

      // اختيار القسم في الإضافة
      document.querySelectorAll(".cat-btn[data-cat]").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".cat-btn[data-cat]")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          currentCategory = btn.dataset.cat;
          updateFormFields();
        });
      });

      // تغيير الحقول بناءً على القسم
      function updateFormFields() {
        const editionGroup = document.getElementById("editionGroup");
        const versionGroup = document.getElementById("versionGroup");
        const fullDescGroup = document.getElementById("fullDescGroup");
        const editionSelect = document.getElementById("edition");

        if (currentCategory === "mods_java") {
          editionGroup.style.display = "block";
          versionGroup.style.display = "block";
          fullDescGroup.style.display = "block";
          editionSelect.value = "java";
          editionSelect.disabled = true;
          document.getElementById(
            "loader",
          ).parentElement.parentElement.style.display = "grid"; // إظهار النواة
        } else if (currentCategory === "mods_bedrock") {
          editionGroup.style.display = "block";
          versionGroup.style.display = "none"; // بيدروك لا يحتاج نواة
          fullDescGroup.style.display = "block";
          editionSelect.value = "bedrock";
          editionSelect.disabled = true;
        } else if (currentCategory === "websites") {
          editionGroup.style.display = "none";
          versionGroup.style.display = "none";
          fullDescGroup.style.display = "none"; // الموقع لا يحتاج وصف طويل
        } else {
          editionGroup.style.display = "none";
          versionGroup.style.display = "none";
          fullDescGroup.style.display = "block";
        }
      }

      // إرسال النموذج
      document
        .getElementById("addForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          let category = "";
          let edition = "";

          if (currentCategory === "mods_java") {
            category = "mods";
            edition = "java";
          } else if (currentCategory === "mods_bedrock") {
            category = "mods";
            edition = "bedrock";
          } else {
            category = currentCategory;
            edition = "none";
          }

          const mod = {
            title: document.getElementById("title").value,
            description: document.getElementById("description").value,
            full_description: document.getElementById("full_description").value,
            image_url: document.getElementById("image_url").value,
            download_url: document.getElementById("download_url").value,
            category: category,
            edition: edition,
            video_url: document.getElementById("video_url").value,
            // الحقول الجديدة
            loader: document.getElementById("loader").value,
            game_version: document.getElementById("game_version").value,
          };

          try {
            const res = await fetch(API_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(mod),
            });
            const data = await res.json();
            if (data.success) {
              showMsg("✅ تم الحفظ بنجاح!", "success");
              document.getElementById("addForm").reset();
              updateFormFields();
            } else {
              showMsg("❌ خطأ: " + data.error, "error");
            }
          } catch (e) {
            showMsg("❌ خطأ في الاتصال", "error");
          }
        });

      // اختيار القسم في الإدارة
      document.querySelectorAll(".cat-btn[data-mcat]").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".cat-btn[data-mcat]")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          loadItems(btn.dataset.mcat);
        });
      });

      // تحميل العناصر للإدارة
      async function loadItems(forceCat = null) {
        const catToLoad = forceCat || "mods_java";
        const list = document.getElementById("itemsList");
        list.innerHTML = "جارٍ التحميل...";

        try {
          const res = await fetch(API_URL);
          const allMods = await res.json();

          let filtered = [];
          if (catToLoad === "mods_java")
            filtered = allMods.filter(
              (m) => m.category === "mods" && m.edition === "java",
            );
          else if (catToLoad === "mods_bedrock")
            filtered = allMods.filter(
              (m) => m.category === "mods" && m.edition === "bedrock",
            );
          else filtered = allMods.filter((m) => m.category === catToLoad);

          if (filtered.length === 0) {
            list.innerHTML =
              "<p style='color:#888;text-align:center;'>لا يوجد محتوى في هذا القسم بعد.</p>";
            return;
          }

          list.innerHTML = filtered
            .map(
              (m) => `
            <div class="item-row">
              <div class="item-row-info">
                <img src="${m.image_url}" alt="">
                <div>
                  <h3>${m.title}</h3>
                  <p>${m.loader ? "⚙️ " + m.loader : ""} ${m.game_version ? " | " + m.game_version : ""}</p>
                </div>
              </div>
              <div>
                <button class="btn btn-danger" onclick="deleteItem(${m.id})">🗑 حذف</button>
              </div>
            </div>
          `,
            )
            .join("");
        } catch (e) {
          list.innerHTML = "<p style='color:#ff5555'>خطأ في التحميل</p>";
        }
      }

      window.deleteItem = async function (id) {
        if (!confirm("هل أنت متأكد من الحذف؟")) return;
        try {
          await fetch(`${API_URL}/${id}`, { method: "DELETE" });
          document.querySelector(".cat-btn[data-mcat].active").click();
        } catch (e) {
          alert("خطأ");
        }
      };

      function showMsg(text, type) {
        const m = document.getElementById("message");
        m.className = "message " + type;
        m.textContent = text;
        setTimeout(() => (m.className = "message"), 3000);
      }
    </script>
  </body>
</html>
