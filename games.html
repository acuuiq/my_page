<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الألعاب | LEON_AT</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      .navbar-inner .nav-links,
      .navbar-inner .subscribe-btn,
      .navbar-inner .menu-toggle,
      .navbar-inner .mobile-menu {
        display: none !important;
      }
      .page-title-nav {
        font-size: 18px;
        font-weight: 900;
        margin: 0;
        background: linear-gradient(
          135deg,
          #ffffff 0%,
          #29d6ff 50%,
          #7c3aed 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: 0.5px;
        flex: 1;
        text-align: center;
        padding: 0 20px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .navbar-inner .nav-back-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        background: rgba(41, 214, 255, 0.08);
        color: var(--primary);
        border: 1px solid rgba(41, 214, 255, 0.3);
        border-radius: 10px;
        font-weight: 700;
        font-size: 13px;
        transition: all 0.3s;
        text-decoration: none;
        flex-shrink: 0;
      }
      .navbar-inner .nav-back-btn:hover {
        background: var(--gradient-1);
        color: white;
        border-color: transparent;
        transform: translateX(4px);
        box-shadow: 0 6px 20px rgba(41, 214, 255, 0.4);
      }
      .page-content-wrapper {
        max-width: 1400px;
        margin: 0 auto;
        padding: 30px 24px;
      }
      .search-box {
        position: relative;
        margin-bottom: 20px;
      }
      .search-box input {
        width: 100%;
        padding: 16px 55px 16px 22px;
        background: rgba(16, 24, 39, 0.9);
        border: 2px solid rgba(41, 214, 255, 0.15);
        border-radius: 14px;
        color: var(--white);
        font-family: "Cairo", sans-serif;
        font-size: 15px;
        font-weight: 600;
        transition: all 0.3s;
        outline: none;
      }
      .search-box input::placeholder {
        color: #666;
      }
      .search-box input:focus {
        border-color: var(--primary);
        background: rgba(16, 24, 39, 1);
        box-shadow: 0 0 25px rgba(41, 214, 255, 0.25);
      }
      .search-box-icon {
        position: absolute;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--primary);
        font-size: 20px;
        pointer-events: none;
      }
      .games-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 18px;
      }
      .game-card {
        background: linear-gradient(
          135deg,
          rgba(16, 24, 39, 1) 0%,
          rgba(21, 28, 48, 1) 100%
        );
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.06);
        transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        flex-direction: column;
        position: relative;
        text-decoration: none;
        color: inherit;
      }
      .game-card::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 16px;
        padding: 1px;
        background: var(--gradient-1);
        -webkit-mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        opacity: 0;
        transition: opacity 0.35s;
        pointer-events: none;
      }
      .game-card:hover::before {
        opacity: 1;
      }
      .game-card:hover {
        transform: translateY(-8px);
        box-shadow:
          0 20px 40px rgba(0, 0, 0, 0.5),
          0 0 30px rgba(41, 214, 255, 0.15);
      }
      .game-card-image {
        width: 100%;
        aspect-ratio: 1 / 1;
        overflow: hidden;
        position: relative;
        background: var(--dark-2);
      }
      .game-card-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .game-card:hover .game-card-image img {
        transform: scale(1.1);
      }
      .game-badge {
        position: absolute;
        top: 10px;
        right: 10px;
        background: var(--gradient-1);
        color: white;
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 10px;
        font-weight: 700;
        z-index: 2;
        box-shadow: 0 4px 12px rgba(41, 214, 255, 0.4);
      }
      .game-card-name {
        padding: 12px 10px;
        text-align: center;
        font-size: 14px;
        font-weight: 700;
        color: var(--white);
        transition: color 0.3s;
        line-height: 1.4;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        min-height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .game-card:hover .game-card-name {
        color: var(--primary);
      }
      .no-results {
        grid-column: 1 / -1;
        text-align: center;
        padding: 60px 20px;
        color: #888;
        font-size: 16px;
      }
      .no-results-icon {
        font-size: 48px;
        margin-bottom: 12px;
        opacity: 0.5;
      }
      @media (max-width: 768px) {
        .page-title-nav {
          font-size: 14px;
          padding: 0 10px;
        }
        .navbar-inner .nav-back-btn {
          padding: 6px 12px;
          font-size: 11px;
        }
        .page-content-wrapper {
          padding: 20px 12px;
        }
        .search-box input {
          padding: 13px 48px 13px 18px;
          font-size: 13px;
        }
        .search-box-icon {
          font-size: 17px;
          right: 16px;
        }
        .games-grid {
          grid-template-columns: repeat(3, 1fr);
          gap: 10px;
        }
        .game-card {
          border-radius: 12px;
        }
        .game-card-name {
          font-size: 11px;
          padding: 8px 6px;
          min-height: 40px;
          -webkit-line-clamp: 2;
        }
        .game-badge {
          font-size: 8px;
          padding: 3px 7px;
          top: 6px;
          right: 6px;
        }
      }
      @media (max-width: 400px) {
        .games-grid {
          grid-template-columns: repeat(3, 1fr);
          gap: 8px;
        }
        .game-card-name {
          font-size: 10px;
          padding: 6px 4px;
          min-height: 36px;
        }
      }
    </style>
  </head>
  <body id="top">
    <div class="loading-overlay" id="loadingOverlay">
      <div class="loader">
        <div class="loader-logo">
          <img src="images/logo.png" alt="LEON_AT" />
        </div>
        <div class="loader-spinner"></div>
        <p class="loader-text">جارٍ التحميل...</p>
      </div>
    </div>
    <nav class="navbar navbar-inner">
      <div class="nav-container">
        <a href="index.html" class="logo"
          ><img src="images/logo.png" alt="LEON_AT" class="logo-img" /><span
            >LEON_AT</span
          ></a
        >
        <h1 class="page-title-nav">🎮 الألعاب</h1>
        <a href="index.html" class="nav-back-btn"> ← الرئيسية </a>
      </div>
    </nav>
    <div class="page-content-wrapper">
      <div class="search-box">
        <input
          type="text"
          id="searchInput"
          placeholder="ابحث عن لعبة..."
          autocomplete="off"
        /><span class="search-box-icon">🔍</span>
      </div>
      <section class="games-grid" id="gamesGrid"></section>
    </div>
    <footer class="footer">
      <div class="footer-container">
        <div class="footer-col">
          <h4>LEON_AT</h4>
          <p>موقعك الأول لتحميل المودات والتطبيقات المشروحة على قناتي.</p>
        </div>
        <div class="footer-col">
          <h4>تابعني</h4>
          <ul>
            <li>
              <a href="https://youtube.com/@leon-at" target="_blank"
                >▶ يوتيوب</a
              >
            </li>
            <li>
              <a href="https://instagram.com/leon_at" target="_blank"
                >📷 إنستجرام</a
              >
            </li>
          </ul>
        </div>
      </div>
      <div class="footer-bottom">
        <p>© 2026 LEON_AT — جميع الحقوق محفوظة</p>
      </div>
    </footer>
    <script>
      const API_URL = "https://leon-at.leon-at.workers.dev/api/mods";
      let allGames = [];
      async function loadGamesFromDB() {
        const grid = document.getElementById("gamesGrid");
        if (!grid) return;
        try {
          const response = await fetch(API_URL);
          const mods = await response.json();
          allGames = mods.filter((mod) => mod.category === "games");
          renderGames(allGames);
        } catch (error) {
          grid.innerHTML =
            "<p style='color:#ff3333;text-align:center;padding:40px;grid-column:1/-1;'>خطأ في تحميل الألعاب</p>";
        }
      }
      function renderGames(games) {
        const grid = document.getElementById("gamesGrid");
        if (!grid) return;
        if (games.length === 0) {
          grid.innerHTML = `<div class="no-results"><div class="no-results-icon">🎮</div>لا توجد ألعاب بعد — قريباً!</div>`;
          return;
        }
        grid.innerHTML = games
          .map((game) => {
            const badge = game.badge
              ? `<span class="game-badge">${game.badge}</span>`
              : "";
            return `
              <a href="mod.html?id=${game.id}" class="game-card">
                <div class="game-card-image">
                  <img src="${game.image_url}" alt="${game.title}" loading="lazy">
                  ${badge}
                </div>
                <div class="game-card-name">${game.title}</div>
              </a>
            `;
          })
          .join("");
      }
      const searchInput = document.getElementById("searchInput");
      if (searchInput) {
        searchInput.addEventListener("input", (e) => {
          const query = e.target.value.trim().toLowerCase();
          if (!query) {
            renderGames(allGames);
            return;
          }
          const filtered = allGames.filter((game) =>
            game.title.toLowerCase().includes(query),
          );
          renderGames(filtered);
        });
      }
      loadGamesFromDB();
    </script>
  </body>
</html>
