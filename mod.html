<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تفاصيل المود | LEON_AT</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      .breadcrumb {
        max-width: 1400px;
        margin: 20px auto 0;
        padding: 0 24px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: #888;
        flex-wrap: wrap;
      }
      .breadcrumb a {
        color: #aaa;
        transition: color 0.3s;
        text-decoration: none;
      }
      .breadcrumb a:hover {
        color: var(--primary);
      }
      .breadcrumb span {
        color: var(--primary);
        font-weight: 700;
      }
      .breadcrumb .separator {
        color: #555;
      }
      .mod-card {
        max-width: 1400px;
        margin: 15px auto 0;
        padding: 0 24px;
      }
      .mod-header {
        background: var(--dark-2);
        border-radius: 14px;
        padding: 18px;
        border: 1px solid rgba(41, 214, 255, 0.15);
        display: grid;
        grid-template-columns: 120px 1fr;
        gap: 18px;
        align-items: start;
      }
      .mod-image {
        width: 120px;
        height: 120px;
        border-radius: 10px;
        overflow: hidden;
        border: 2px solid rgba(41, 214, 255, 0.3);
        flex-shrink: 0;
      }
      .mod-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .mod-info h1 {
        font-size: 20px;
        font-weight: 900;
        margin-bottom: 8px;
        background: linear-gradient(135deg, #ffffff 0%, #29d6ff 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
      }
      .mod-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 10px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 9px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 700;
      }
      .badge-edition {
        background: rgba(255, 165, 0, 0.15);
        color: #ffa500;
        border: 1px solid rgba(255, 165, 0, 0.3);
      }
      .badge-edition.bedrock {
        background: rgba(0, 212, 100, 0.15);
        color: #00d464;
        border-color: rgba(0, 212, 100, 0.3);
      }
      .badge-category {
        background: rgba(41, 214, 255, 0.15);
        color: var(--primary);
        border: 1px solid rgba(41, 214, 255, 0.3);
      }
      .mod-description {
        color: #bbb;
        font-size: 13px;
        line-height: 1.7;
        margin-bottom: 12px;
      }
      .mod-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .mod-actions a {
        padding: 8px 18px;
        font-size: 12px;
        border-radius: 8px;
        text-decoration: none;
      }
      .tabs-container {
        max-width: 1400px;
        margin: 25px auto;
        padding: 0 24px;
      }
      .tabs-header {
        display: flex;
        gap: 4px;
        background: var(--dark-2);
        padding: 5px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        margin-bottom: 15px;
        overflow-x: auto;
      }
      .tab-btn {
        flex: 1;
        padding: 10px 20px;
        background: transparent;
        border: none;
        color: #888;
        font-family: "Cairo", sans-serif;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
        border-radius: 8px;
        transition: all 0.3s;
        white-space: nowrap;
      }
      .tab-btn.active {
        background: var(--gradient-1);
        color: white;
        box-shadow: 0 4px 15px rgba(41, 214, 255, 0.3);
      }
      .tab-content {
        display: none;
        animation: fadeIn 0.3s ease-out;
      }
      .tab-content.active {
        display: block;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .description-box {
        background: var(--dark-2);
        padding: 20px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        color: #bbb;
        font-size: 14px;
        line-height: 1.9;
        white-space: pre-wrap;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 12px;
      }
      .gallery img {
        width: 100%;
        height: 140px;
        object-fit: cover;
        border-radius: 10px;
        cursor: pointer;
        transition:
          transform 0.3s,
          box-shadow 0.3s;
        border: 2px solid transparent;
      }
      .gallery img:hover {
        transform: scale(1.05);
        box-shadow: 0 10px 30px rgba(41, 214, 255, 0.3);
        border-color: var(--primary);
      }
      .versions-list {
        background: var(--dark-2);
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      .version-header {
        display: grid;
        grid-template-columns: 100px 130px 1fr 110px;
        padding: 12px 18px;
        background: rgba(41, 214, 255, 0.05);
        border-bottom: 1px solid rgba(41, 214, 255, 0.15);
        color: var(--primary);
        font-weight: 700;
        font-size: 12px;
        gap: 12px;
      }
      .version-item {
        display: grid;
        grid-template-columns: 100px 130px 1fr 110px;
        align-items: center;
        padding: 14px 18px;
        gap: 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        transition: background 0.3s;
      }
      .version-item:last-child {
        border-bottom: none;
      }
      .version-tag {
        background: var(--gradient-1);
        color: white;
        padding: 4px 10px;
        border-radius: 6px;
        font-weight: 700;
        font-size: 12px;
        text-align: center;
        display: inline-block;
        width: fit-content;
      }
      .version-mc {
        color: var(--primary);
        font-weight: 600;
        font-size: 13px;
      }
      .version-changelog {
        color: #999;
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .version-download {
        background: var(--gradient-1);
        color: white;
        padding: 8px 14px;
        border-radius: 6px;
        font-weight: 700;
        font-size: 12px;
        text-align: center;
        transition: 0.3s;
        display: inline-block;
        text-decoration: none;
      }
      .empty-state {
        text-align: center;
        padding: 40px 30px;
        background: var(--dark-2);
        border-radius: 12px;
        border: 1px dashed rgba(41, 214, 255, 0.2);
        color: #666;
        font-size: 13px;
      }
      .empty-state-icon {
        font-size: 36px;
        margin-bottom: 10px;
        opacity: 0.5;
      }
      .lightbox {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.92);
        backdrop-filter: blur(8px);
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }
      .lightbox.active {
        opacity: 1;
        pointer-events: all;
      }
      .lightbox-content img {
        max-width: 90vw;
        max-height: 80vh;
        object-fit: contain;
        border-radius: 12px;
        border: 2px solid rgba(41, 214, 255, 0.3);
      }
      .lightbox-close {
        position: absolute;
        top: 20px;
        right: 20px;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: rgba(255, 50, 50, 0.9);
        color: white;
        border: none;
        font-size: 22px;
        cursor: pointer;
      }
      .lightbox-nav {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: rgba(41, 214, 255, 0.15);
        color: var(--primary);
        border: 2px solid rgba(41, 214, 255, 0.4);
        font-size: 32px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .lightbox-prev {
        right: 20px;
      }
      .lightbox-next {
        left: 20px;
      }
      @media (max-width: 768px) {
        .mod-header {
          grid-template-columns: 1fr;
          padding: 15px;
          gap: 15px;
          text-align: center;
        }
        .mod-image {
          width: 120px;
          height: 120px;
          margin: 0 auto;
        }
        .tabs-container {
          margin: 20px auto;
        }
        .version-header {
          display: none;
        }
        .version-item {
          grid-template-columns: 1fr;
          gap: 8px;
          padding: 12px;
          text-align: center;
        }
        .version-changelog {
          white-space: normal;
        }
        .version-download {
          width: 100%;
        }
        .mod-badges {
          justify-content: center;
        }
      }
    </style>
  </head>
  <body id="top">
    <div class="loading-overlay" id="loadingOverlay">
      <div class="loader">
        <div class="loader-logo">
          <img src="images/logo.png" alt="LEON_AT" />
        </div>
        <div class="loader-spinner"></div>
        <p class="loader-text">جارٍ التحميل...</p>
      </div>
    </div>
    <nav class="navbar navbar-inner">
      <div class="nav-container">
        <a href="index.html" class="logo"
          ><img src="images/logo.png" alt="LEON_AT" class="logo-img" /><span
            >LEON_AT</span
          ></a
        >
        <button class="nav-back-btn" onclick="history.back()">← السابق</button>
      </div>
    </nav>
    <div class="breadcrumb" id="breadcrumb">
      <a href="index.html">🏠 الرئيسية</a><span class="separator">›</span>
      <a href="addons-java.html" id="breadcrumbParent">📦 إضافات Java</a
      ><span class="separator">›</span>
      <span id="breadcrumbTitle">جارٍ التحميل...</span>
    </div>
    <div class="mod-card" id="modCard">
      <div class="empty-state">
        <div class="empty-state-icon">⏳</div>
        جارٍ تحميل التفاصيل...
      </div>
    </div>
    <div class="tabs-container" id="tabsContainer" style="display: none">
      <div class="tabs-header">
        <button class="tab-btn active" data-tab="description">📝 الوصف</button>
        <button class="tab-btn" data-tab="images">📸 الصور</button>
        <button class="tab-btn" data-tab="versions">📦 الإصدارات</button>
      </div>
      <div class="tab-content active" id="tab-description">
        <div class="description-box" id="descriptionContent">
          جارٍ التحميل...
        </div>
      </div>
      <div class="tab-content" id="tab-images">
        <div id="imagesContent">جارٍ التحميل...</div>
      </div>
      <div class="tab-content" id="tab-versions">
        <div id="versionsContent">جارٍ التحميل...</div>
      </div>
    </div>
    <div class="lightbox" id="lightbox">
      <button class="lightbox-close" id="lightboxClose">✕</button>
      <button class="lightbox-nav lightbox-prev" id="lightboxPrev">‹</button>
      <button class="lightbox-nav lightbox-next" id="lightboxNext">›</button>
      <div class="lightbox-content">
        <img src="" alt="صورة" id="lightboxImage" />
      </div>
    </div>
    <footer class="footer">
      <div class="footer-container">
        <div class="footer-col">
          <h4>LEON_AT</h4>
          <p>موقعك الأول لتحميل المودات والتطبيقات.</p>
        </div>
        <div class="footer-col">
          <h4>تابعني</h4>
          <ul>
            <li>
              <a href="https://youtube.com/@leon-at" target="_blank"
                >▶ يوتيوب</a
              >
            </li>
            <li>
              <a href="https://instagram.com/leon_at" target="_blank"
                >📷 إنستجرام</a
              >
            </li>
          </ul>
        </div>
      </div>
      <div class="footer-bottom">
        <p>© 2026 LEON_AT — جميع الحقوق محفوظة</p>
      </div>
    </footer>
    <script>
      const API_URL = "https://leon-at.leon-at.workers.dev/api/mods";
      const params = new URLSearchParams(window.location.search);
      const modId = params.get("id");

      async function loadModDetails() {
        const cardContainer = document.getElementById("modCard");
        if (!modId) {
          cardContainer.innerHTML =
            "<div class='empty-state'>لم يتم تحديد مود</div>";
          return;
        }
        try {
          const response = await fetch(`${API_URL}/${modId}`);
          const mod = await response.json();
          if (mod.error) {
            cardContainer.innerHTML =
              "<div class='empty-state'>المود غير موجود</div>";
            return;
          }

          document.getElementById("breadcrumbTitle").textContent = mod.title;
          const parentLink = document.getElementById("breadcrumbParent");
          if (mod.edition === "bedrock") {
            parentLink.textContent = "📦 إضافات Bedrock";
            parentLink.href = "addons-bedrock.html";
          } else if (mod.edition === "rust") {
            parentLink.textContent = "📦 إضافات Rust";
            parentLink.href = "addons-rust.html";
          } else if (mod.edition === "ark") {
            parentLink.textContent = "📦 إضافات ARK";
            parentLink.href = "addons-ark.html";
          } else {
            parentLink.textContent = "📦 إضافات Java";
            parentLink.href = "addons-java.html";
          }

          const editionClass = mod.edition === "bedrock" ? "bedrock" : "";
          const editionText =
            mod.edition === "bedrock"
              ? "Bedrock"
              : mod.edition === "rust"
                ? "Rust"
                : mod.edition === "ark"
                  ? "ARK"
                  : "Java";
          const videoBtn = mod.video_url
            ? `<a href="${mod.video_url}" target="_blank" class="btn-secondary" style="background:var(--gradient-1); color:white;">▶ مشاهدة الشرح</a>`
            : "";

          cardContainer.innerHTML = `
            <div class="mod-header">
              <div class="mod-image"><img src="${mod.image_url}" alt="${mod.title}"></div>
              <div class="mod-info">
                <h1>${mod.title}</h1>
                <div class="mod-badges">
                  <span class="badge badge-edition ${editionClass}">🎮 ${editionText} Edition</span>
                  <span class="badge badge-category">📁 ${mod.category}</span>
                </div>
                <p class="mod-description">
                  <span style="color: var(--primary); font-weight: 700; display: inline-block; margin-bottom: 5px;">
                    ⚙️ النوع: ${mod.loader || "غير محدد"} | 🎮 إصدار اللعبة: ${mod.game_version || "غير محدد"}
                  </span><br>
                  <span style="font-size: 13px; color: #aaa;">${mod.description}</span>
                </p>
                <div class="mod-actions">${videoBtn}</div>
              </div>
            </div>
          `;

          document.getElementById("tabsContainer").style.display = "block";
          const descriptionContent =
            document.getElementById("descriptionContent");
          if (mod.full_description) {
            descriptionContent.textContent = mod.full_description;
          } else {
            descriptionContent.innerHTML = `<div class="empty-state" style="border:none;background:transparent;">لا يوجد وصف كامل بعد</div>`;
          }

          const imagesContent = document.getElementById("imagesContent");
          if (mod.images && mod.images.length > 0) {
            imagesContent.innerHTML = `<div class="gallery">${mod.images.map((img, index) => `${img.image_url.match(/\.(jpeg|jpg|gif|png|webp)$/i) ? `<img src="${img.image_url}" alt="صورة" data-index="${index}" class="gallery-img">` : ""}`).join("")}</div>`;
            window.galleryImages = mod.images.map((img) => img.image_url);
          } else {
            imagesContent.innerHTML = `<div class="empty-state">لا توجد صور مضافة بعد</div>`;
          }

          const versionsContent = document.getElementById("versionsContent");
          if (mod.versions && mod.versions.length > 0) {
            versionsContent.innerHTML = `
              <div class="versions-list">
                <div class="version-header"><span>الإصدار</span><span>إصدار اللعبة</span><span>الوصف</span><span>التحميل</span></div>
                ${mod.versions
                  .map(
                    (v) => `
                  <div class="version-item">
                    <span class="version-tag">${v.version}</span>
                    <span class="version-mc">${v.minecraft_version || "-"}</span>
                    <span class="version-changelog">${v.changelog || "لا يوجد وصف"}</span>
                    <a href="${v.download_url}" target="_blank" class="version-download">⬇ تحميل</a>
                  </div>
                `,
                  )
                  .join("")}
              </div>
            `;
          } else {
            versionsContent.innerHTML = `<div class="empty-state">لا توجد إصدارات مضافة بعد</div>`;
          }
        } catch (error) {
          cardContainer.innerHTML =
            "<div class='empty-state'>خطأ في تحميل البيانات</div>";
        }
      }

      document.querySelectorAll(".tab-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".tab-btn")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          document
            .querySelectorAll(".tab-content")
            .forEach((content) => content.classList.remove("active"));
          document
            .getElementById(`tab-${btn.dataset.tab}`)
            .classList.add("active");
        });
      });

      loadModDetails();
      const lightbox = document.getElementById("lightbox");
      const lightboxImage = document.getElementById("lightboxImage");
      const lightboxClose = document.getElementById("lightboxClose");
      const lightboxPrev = document.getElementById("lightboxPrev");
      const lightboxNext = document.getElementById("lightboxNext");
      let currentImageIndex = 0;

      document.addEventListener("click", (e) => {
        if (e.target.classList.contains("gallery-img")) {
          openLightbox(parseInt(e.target.dataset.index));
        }
      });

      function openLightbox(index) {
        if (!window.galleryImages || window.galleryImages.length === 0) return;
        currentImageIndex = index;
        updateLightboxImage();
        lightbox.classList.add("active");
      }
      function updateLightboxImage() {
        const images = window.galleryImages;
        lightboxImage.src = images[currentImageIndex];
        if (images.length <= 1) {
          lightboxPrev.style.display = "none";
          lightboxNext.style.display = "none";
        } else {
          lightboxPrev.style.display = "flex";
          lightboxNext.style.display = "flex";
        }
      }
      function closeLightbox() {
        lightbox.classList.remove("active");
      }
      function nextImage() {
        currentImageIndex =
          (currentImageIndex + 1) % window.galleryImages.length;
        updateLightboxImage();
      }
      function prevImage() {
        currentImageIndex =
          (currentImageIndex - 1 + window.galleryImages.length) %
          window.galleryImages.length;
        updateLightboxImage();
      }

      lightboxClose.addEventListener("click", closeLightbox);
      lightboxNext.addEventListener("click", nextImage);
      lightboxPrev.addEventListener("click", prevImage);
      lightbox.addEventListener("click", (e) => {
        if (e.target === lightbox) closeLightbox();
      });
    </script>
  </body>
</html>
