<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إضافات Java | LEON_AT</title>
    <link rel="stylesheet" href="../../style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ============================================
         🎨 تصميم صفحة إضافات Java
         ============================================ */

      /* ===== شريط التنقل المبسّط ===== */
      .navbar-inner .nav-links,
      .navbar-inner .subscribe-btn,
      .navbar-inner .menu-toggle,
      .navbar-inner .mobile-menu {
        display: none !important;
      }

      /* ⭐ عنوان الصفحة في شريط المهام */
      .page-title-nav {
        font-size: 18px;
        font-weight: 900;
        margin: 0;
        background: linear-gradient(
          135deg,
          #ffffff 0%,
          #29d6ff 50%,
          #7c3aed 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: 0.5px;
        flex: 1;
        text-align: center;
        padding: 0 20px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .navbar-inner .nav-back-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        background: rgba(41, 214, 255, 0.08);
        color: var(--primary);
        border: 1px solid rgba(41, 214, 255, 0.3);
        border-radius: 10px;
        font-weight: 700;
        font-size: 13px;
        transition: all 0.3s;
        text-decoration: none;
        flex-shrink: 0;
      }

      .navbar-inner .nav-back-btn:hover {
        background: var(--gradient-1);
        color: white;
        border-color: transparent;
        transform: translateX(4px);
        box-shadow: 0 6px 20px rgba(41, 214, 255, 0.4);
      }

      /* ===== محتوى الصفحة ===== */
      .page-content-wrapper {
        max-width: 1400px;
        margin: 0 auto;
        padding: 30px 24px;
      }

      /* ===== مربع البحث ===== */
      .search-box {
        position: relative;
        margin-bottom: 20px;
      }

      .search-box input {
        width: 100%;
        padding: 16px 55px 16px 22px;
        background: rgba(16, 24, 39, 0.9);
        border: 2px solid rgba(41, 214, 255, 0.15);
        border-radius: 14px;
        color: var(--white);
        font-family: "Cairo", sans-serif;
        font-size: 15px;
        font-weight: 600;
        transition: all 0.3s;
        outline: none;
      }

      .search-box input::placeholder {
        color: #666;
      }

      .search-box input:focus {
        border-color: var(--primary);
        background: rgba(16, 24, 39, 1);
        box-shadow: 0 0 25px rgba(41, 214, 255, 0.25);
      }

      .search-box-icon {
        position: absolute;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--primary);
        font-size: 20px;
        pointer-events: none;
      }

      /* ===== شريط الفلاتر ===== */
      .filter-bar-inline {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 24px;
        justify-content: flex-start;
        max-width: 100%;
        padding: 0;
        margin-top: 0;
      }

      .filter-bar-inline .filter-btn {
        padding: 8px 18px;
        font-size: 13px;
        border-radius: 20px;
        background: rgba(16, 24, 39, 0.9);
        color: var(--light);
        border: 1px solid rgba(255, 255, 255, 0.08);
        font-family: "Cairo", sans-serif;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s;
      }

      .filter-bar-inline .filter-btn:hover {
        border-color: var(--primary);
        color: var(--primary);
        transform: translateY(-2px);
      }

      .filter-bar-inline .filter-btn.active {
        background: var(--gradient-1);
        color: white;
        border-color: transparent;
        box-shadow: 0 6px 20px rgba(41, 214, 255, 0.3);
      }

      /* ===== شبكة البطاقات ===== */
      .cards-grid-inner {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 16px;
      }

      .cards-grid-inner .card {
        background: linear-gradient(
          135deg,
          rgba(16, 24, 39, 1) 0%,
          rgba(21, 28, 48, 1) 100%
        );
        border-radius: 14px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.06);
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        flex-direction: column;
        position: relative;
        text-decoration: none;
        color: inherit;
      }

      .cards-grid-inner .card:hover {
        transform: translateY(-6px);
        box-shadow:
          0 15px 35px rgba(0, 0, 0, 0.4),
          0 0 25px rgba(41, 214, 255, 0.15);
        border-color: rgba(41, 214, 255, 0.3);
      }

      .cards-grid-inner .card-image {
        height: 120px;
        overflow: hidden;
        position: relative;
      }

      .cards-grid-inner .card-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.6s;
      }

      .cards-grid-inner .card:hover .card-image img {
        transform: scale(1.08);
      }

      .cards-grid-inner .card-badge {
        position: absolute;
        top: 8px;
        right: 8px;
        background: var(--gradient-1);
        color: white;
        padding: 3px 10px;
        border-radius: 6px;
        font-size: 10px;
        font-weight: 700;
        box-shadow: 0 4px 12px rgba(41, 214, 255, 0.4);
      }

      .cards-grid-inner .card-body {
        padding: 12px;
        display: flex;
        flex-direction: column;
        flex-grow: 1;
      }

      .cards-grid-inner .card-body h3 {
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 4px;
        color: var(--white);
        transition: color 0.3s;
        line-height: 1.3;
      }

      .cards-grid-inner .card:hover .card-body h3 {
        color: var(--primary);
      }

      .cards-grid-inner .card-body p {
        color: #888;
        font-size: 11px;
        margin-bottom: 10px;
        flex-grow: 1;
        line-height: 1.5;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .cards-grid-inner .card-btn {
        display: inline-block;
        background: var(--gradient-1);
        color: white;
        padding: 7px;
        border-radius: 8px;
        text-align: center;
        font-weight: 700;
        font-size: 11px;
        transition: all 0.3s;
      }

      /* ===== رسالة "لا نتائج" ===== */
      .no-results {
        grid-column: 1 / -1;
        text-align: center;
        padding: 60px 20px;
        color: #888;
        font-size: 16px;
      }

      .no-results-icon {
        font-size: 48px;
        margin-bottom: 12px;
        opacity: 0.5;
      }

      /* ===== الجوال ===== */
      @media (max-width: 768px) {
        .page-title-nav {
          font-size: 14px;
          padding: 0 10px;
        }

        .navbar-inner .nav-back-btn {
          padding: 6px 12px;
          font-size: 11px;
        }

        .page-content-wrapper {
          padding: 20px 12px;
        }

        .search-box input {
          padding: 13px 48px 13px 18px;
          font-size: 13px;
        }

        .search-box-icon {
          font-size: 17px;
          right: 16px;
        }

        .filter-bar-inline {
          overflow-x: auto;
          flex-wrap: nowrap;
          scrollbar-width: none;
          padding-bottom: 4px;
        }

        .filter-bar-inline::-webkit-scrollbar {
          display: none;
        }

        .filter-bar-inline .filter-btn {
          flex-shrink: 0;
          padding: 6px 14px;
          font-size: 11px;
        }

        .cards-grid-inner {
          grid-template-columns: repeat(2, 1fr);
          gap: 10px;
        }

        .cards-grid-inner .card-image {
          height: 90px;
        }

        .cards-grid-inner .card-body {
          padding: 10px;
        }

        .cards-grid-inner .card-body h3 {
          font-size: 12px;
        }

        .cards-grid-inner .card-body p {
          font-size: 10px;
        }

        .cards-grid-inner .card-btn {
          padding: 6px;
          font-size: 10px;
        }
      }

      /* ===== الجوال الصغير جداً ===== */
      @media (max-width: 400px) {
        .cards-grid-inner {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body id="top">
    <!-- شاشة التحميل -->
    <div class="loading-overlay" id="loadingOverlay">
      <div class="loader">
        <div class="loader-logo">
          <img src="../../images/logo.png" alt="LEON_AT" />
        </div>
        <div class="loader-spinner"></div>
        <p class="loader-text">جارٍ التحميل...</p>
      </div>
    </div>

    <!-- ============================================
         شريط التنقل: الشعار + العنوان + زر الرجوع
         ============================================ -->
    <nav class="navbar navbar-inner">
      <div class="nav-container">
        <a href="../../index.html" class="logo">
          <img src="../../images/logo.png" alt="LEON_AT" class="logo-img" />
          <span>LEON_AT</span>
        </a>

        <!-- ⭐ عنوان الصفحة في المنتصف -->
        <h1 class="page-title-nav">إضافات Java Edition</h1>

        <a href="../../index.html" class="nav-back-btn"> ← الرئيسية </a>
      </div>
    </nav>

    <!-- ============================================
         محتوى الصفحة
         ============================================ -->
    <div class="page-content-wrapper">
      <!-- ===== مربع البحث ===== -->
      <div class="search-box">
        <input
          type="text"
          id="searchInput"
          placeholder="ابحث عن إضافة..."
          autocomplete="off"
        />
        <span class="search-box-icon">🔍</span>
      </div>

      <!-- ===== شريط الفلاتر ===== -->
      <div class="filter-bar-inline">
        <button class="filter-btn active" data-filter="all">الكل</button>
        <button class="filter-btn" data-filter="mods">مودات</button>
        <button class="filter-btn" data-filter="packs">ريسورس باكات</button>
        <button class="filter-btn" data-filter="shaders">شيدرز</button>
        <button class="filter-btn" data-filter="worlds">عوالم</button>
      </div>

      <!-- ===== شبكة البطاقات ===== -->
      <section class="cards-grid-inner" id="javaCardsGrid">
        <!-- المودات تُحمَّل تلقائياً -->
      </section>
    </div>

    <!-- ============================================
         التذييل
         ============================================ -->
    <footer class="footer">
      <div class="footer-container">
        <div class="footer-col">
          <h4>LEON_AT</h4>
          <p>موقعك الأول لتحميل المودات والتطبيقات المشروحة على قناتي.</p>
        </div>
        <div class="footer-col">
          <h4>روابط سريعة</h4>
          <ul>
            <li><a href="../../index.html">الرئيسية</a></li>
            <li><a href="addons-java.html">إضافات Java</a></li>
            <li><a href="addons-bedrock.html">إضافات Bedrock</a></li>
            <li><a href="../../games.html">الألعاب</a></li>
            <li><a href="../../apps.html">التطبيقات</a></li>
          </ul>
        </div>
        <div class="footer-col">
          <h4>تابعني</h4>
          <ul>
            <li>
              <a href="https://youtube.com/@leon-at" target="_blank">يوتيوب</a>
            </li>
            <li><a href="#">تيليجرام</a></li>
            <li><a href="#">إنستجرام</a></li>
          </ul>
        </div>
      </div>
      <div class="footer-bottom">
        <p>© 2026 LEON_AT — جميع الحقوق محفوظة</p>
      </div>
    </footer>

    <script>
      // ===== جلب المودات من قاعدة البيانات =====
      const API_URL = "https://leon-at.leon-at.workers.dev/api/mods";
      let allMods = [];

      async function loadModsFromDB() {
        const grid = document.getElementById("javaCardsGrid");
        if (!grid) return;

        try {
          const response = await fetch(API_URL);
          const mods = await response.json();

          allMods = mods.filter(
            (mod) =>
              mod.edition === "java" || mod.edition === "Java" || !mod.edition,
          );

          renderMods(allMods);
        } catch (error) {
          grid.innerHTML =
            "<p style='color:#ff3333;text-align:center;padding:40px;grid-column:1/-1;'>خطأ في تحميل المودات</p>";
          console.error(error);
        }
      }

      // ===== عرض المودات =====
      function renderMods(mods) {
        const grid = document.getElementById("javaCardsGrid");
        if (!grid) return;

        if (mods.length === 0) {
          grid.innerHTML = `
            <div class="no-results">
              <div class="no-results-icon">🔍</div>
              لا توجد نتائج مطابقة
            </div>
          `;
          return;
        }

        grid.innerHTML = mods
          .map((mod) => {
            const badge = mod.badge
              ? `<span class="card-badge">${mod.badge}</span>`
              : "";

            return `
              <a href="mod.html?id=${mod.id}" class="card" data-category="${mod.category}">
                <div class="card-image">
                  <img src="${mod.image_url}" alt="${mod.title}">
                  ${badge}
                </div>
                <div class="card-body">
                  <h3>${mod.title}</h3>
                  <p>${mod.description}</p>
                  <span class="card-btn">عرض التفاصيل</span>
                </div>
              </a>
            `;
          })
          .join("");
      }

      // ===== البحث =====
      const searchInput = document.getElementById("searchInput");
      if (searchInput) {
        searchInput.addEventListener("input", (e) => {
          const query = e.target.value.trim().toLowerCase();
          const activeFilter = document.querySelector(
            ".filter-bar-inline .filter-btn.active",
          );
          const filter = activeFilter ? activeFilter.dataset.filter : "all";

          let filtered = allMods;

          if (filter !== "all") {
            filtered = filtered.filter((mod) => mod.category === filter);
          }

          if (query) {
            filtered = filtered.filter(
              (mod) =>
                mod.title.toLowerCase().includes(query) ||
                mod.description.toLowerCase().includes(query),
            );
          }

          renderMods(filtered);
        });
      }

      // ===== الفلترة =====
      document
        .querySelectorAll(".filter-bar-inline .filter-btn")
        .forEach((btn) => {
          btn.addEventListener("click", () => {
            document
              .querySelectorAll(".filter-bar-inline .filter-btn")
              .forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");

            const filter = btn.dataset.filter;
            const query = searchInput
              ? searchInput.value.trim().toLowerCase()
              : "";

            let filtered = allMods;

            if (filter !== "all") {
              filtered = filtered.filter((mod) => mod.category === filter);
            }

            if (query) {
              filtered = filtered.filter(
                (mod) =>
                  mod.title.toLowerCase().includes(query) ||
                  mod.description.toLowerCase().includes(query),
              );
            }

            renderMods(filtered);
          });
        });

      // تحميل المودات عند فتح الصفحة
      loadModsFromDB();
    </script>
  </body>
</html>
